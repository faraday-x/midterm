<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OASIS COLLECTION - Live Forever</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=Caveat:wght@600;700&family=Inter:wght@400;500;600;700;800&family=Montserrat:ital,wght@0,700;0,800;0,900;1,900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body class="poster-layout-page">

  <header class="poster-navbar">
    <div class="nav-left-brand">
      <img src="image/Oasis_Logo.png" alt="oasis logo" class="nav-oasis-logo" />
      <div class="nav-brand-text">
        <span class="nav-brand-title">OASIS COLLECTION</span>
        <span class="nav-brand-sub">MUSIC / MEMORIES / FOREVER</span>
      </div>
    </div>

    <nav class="poster-nav-links">
      <a href="index.html" class="active">HOME</a>
      <a href="story.html">STORY</a>
      <a href="collection.html">COLLECTION</a>
      <a href="about.html">ABOUT</a>
    </nav>
  </header>

  <main class="poster-main-viewport">
    
    <div class="poster-left-content">
      <div class="poster-title-img-wrapper">
        <img src="image/Oasis_Collection_text.png" alt="Oasis Collection - Music / Memories / Forever" class="poster-title-img" />
      </div>

      <p class="poster-desc-text">
        A collection dedicated to the band that changed British music forever.<br />
        Oasis — from the streets of Manchester to the world.
      </p>

      <div class="poster-btn-wrapper">
        <a href="story.html" class="poster-explore-btn">
          EXPLORE THE ARCHIVE <span>&rarr;</span>
        </a>
      </div>

      <div class="poster-bottom-meta">
        <span class="globe-icon">🌐</span>
        <span class="meta-text">MANCHESTER / 1994 — 2009</span>
      </div>
    </div>

    <div class="poster-right-collage">
      <div class="collage-stage">
        <div class="paint-splatter splatter-top"></div>
        <div class="paint-splatter splatter-center"></div>
        <div class="paint-splatter splatter-bottom"></div>

        <div class="collage-item polaroid-band">
          <div class="blue-tape tape-corner-left"></div>
          <img src="image/Oasis_brand_photo.png" alt="Oasis in New York" class="photo-img" />

        </div>

        <div class="collage-item torn-concert">
          <div class="blue-tape tape-top-center"></div>
          <img src="image/live_concert_shot.png" alt="Oasis Live Stage" class="photo-img" />
          
          <div class="some-might-say-scrap">
            <span>Some<br>might say<br>...</span>
          </div>
        </div>

        <div class="collage-item ticket-knebworth">
          <img src="image/[ KNEBWORTH 1996 TICKET ].png" alt="Knebworth 1996 Ticket" class="ticket-img" />
        </div>

        <div class="collage-item epiphone-guitar">
          <img src="image/Epiphone Union Jack Sheraton.png" alt="Noel's Union Jack Guitar" class="guitar-img" />
          <div class="handwritten-definitely-maybe">
            Definitely<br>Maybe
          </div>
        </div>

        <div class="collage-item round-oasis-patch">
          <div class="mini-oasis-badge">oasis</div>
        </div>
      </div>
    </div>

  </main>

</body>
</html>
